<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - FreshPress Laundry</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="/">Home</a> | <a href="/about">About</a> | <a href="/contact">Contact</a>
    </nav>
    <div class="container">
        <h1>Get In Touch</h1>
        <p>Have a special request or a bulk order? Send us a message below.</p>
        
        <form action="#" method="POST">
            <div style="margin-bottom: 10px;">
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" required>
            </div>
            <div style="margin-bottom: 10px;">
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required>
            </div>
            <div style="margin-bottom: 10px;">
                <label for="msg">Message:</label><br>
                <textarea id="msg" name="msg" rows="4" style="width: 100%;"></textarea>
            </div>
            <button type="submit">Send Message</button>
        </form>

        <hr>
        <h3>Visit Our Shop</h3>
        <p>123 Bubbles Ave, Clean City, 54321</p>
        <p><strong>Phone:</strong> (555) 012-3456</p>
    </div>
</body>
</html>
